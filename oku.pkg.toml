# The manifest `oku add github:y3owk1n/fude` reads. It installs a release's
# zip, and builds the release from source where no zip fits. fude-main.toml
# builds the newest commit of main instead. Check a change with
# `oku manifest lint` and `oku manifest test`.
[package]
name = "fude"
description = "A modal text editor that works the way Neovim does, without its weight"
homepage = "https://github.com/y3owk1n/fude"
license = "MIT"
# publish-artifacts.yml attests every release zip.
signer_workflow = "y3owk1n/fude/.github/workflows/publish-artifacts.yml"
attestations = true

[version]
from = "github-releases"
repo = "y3owk1n/fude"
strip_prefix = "v"

[[artifact]]
match = { os = "darwin", arch = "arm64" }
url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-darwin-arm64.zip"
sha256_url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-darwin-arm64.zip.sha256"
bin = ["bin/fude"]
man = ["share/man/man1/fude.1", "share/man/man5/fude-config.5", "share/man/man7/fude-guide.7"]

[[artifact]]
match = { os = "darwin", arch = "amd64" }
url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-darwin-amd64.zip"
sha256_url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-darwin-amd64.zip.sha256"
bin = ["bin/fude"]
man = ["share/man/man1/fude.1", "share/man/man5/fude-config.5", "share/man/man7/fude-guide.7"]

# The Linux binary links glibc, so a musl machine builds from source instead.
[[artifact]]
match = { os = "linux", arch = "arm64", libc = "glibc" }
url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-linux-arm64.zip"
sha256_url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-linux-arm64.zip.sha256"
bin = ["bin/fude"]
man = ["share/man/man1/fude.1", "share/man/man5/fude-config.5", "share/man/man7/fude-guide.7"]

[[artifact]]
match = { os = "linux", arch = "amd64", libc = "glibc" }
url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-linux-amd64.zip"
sha256_url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-linux-amd64.zip.sha256"
bin = ["bin/fude"]
man = ["share/man/man1/fude.1", "share/man/man5/fude-config.5", "share/man/man7/fude-guide.7"]

[[artifact]]
match = { os = "windows", arch = "arm64" }
url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-windows-arm64.zip"
sha256_url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-windows-arm64.zip.sha256"
bin = ["bin/fude.exe"]

[[artifact]]
match = { os = "windows", arch = "amd64" }
url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-windows-amd64.zip"
sha256_url = "https://github.com/y3owk1n/fude/releases/download/{{tag}}/fude-windows-amd64.zip.sha256"
bin = ["bin/fude.exe"]

# tree-sitter's binding builds through cgo, so the build needs a C compiler.
# Windows has none of its own, so there llvm-mingw comes as a dep below.
# fude itself builds each grammar with git and a C compiler, so an install
# from a zip needs them too. On Windows that compiler is gcc.
[host]
xcode-clt = { path = "/Library/Developer/CommandLineTools/usr/bin/clang", install = "xcode-select --install", when = { os = "darwin" } }
cc = { command = "cc", apt = "build-essential", dnf = "gcc", pacman = "base-devel", when = { os = "linux" } }
git = { command = "git", apt = "git", dnf = "git", pacman = "git", install = "install Git for Windows from https://git-scm.com", when = [{ os = "linux" }, { os = "windows" }] }
gcc = { command = "gcc", install = "install llvm-mingw from https://github.com/mstorsjo/llvm-mingw and put its bin on PATH", when = { os = "windows" } }

# Where no zip fits, it builds as `just build` and `just man` do, with go and
# llvm-mingw from the repo's own manifests at the same release. Windows runs
# its steps in PowerShell.
[build]
needs = ["git"]
deps = [
  { ref = "./.oku/go.toml", version = "~1.26" },
  { ref = "./.oku/llvm-mingw.toml", when = { os = "windows" } },
]
source = { git = "https://github.com/y3owk1n/fude", tag = "{{tag}}" }

# go mod vendor refuses to run in a workspace. The root module's go.mod
# brings in the other modules through its replace lines, so the build needs
# no go.work. Without its own go.mod, cmd/fude builds as a package of the
# root, as go install takes it from a release (D37).
[[build.step]]
run = "rm -f go.work go.work.sum cmd/fude/go.mod"
shell = "sh"
when = [{ os = "darwin" }, { os = "linux" }]

[[build.step]]
run = "Remove-Item -Force -ErrorAction SilentlyContinue go.work, go.work.sum, cmd/fude/go.mod"
shell = "pwsh"
when = { os = "windows" }

[[build.step]]
vendor = "go"

# go mod vendor keeps only the folders of Go packages, so it leaves out the C
# that tree-sitter's cgo includes: go-tree-sitter's include and src, and the
# Go grammar's src. These fetch the two modules from the Go proxy at the
# versions go.mod requires, and the step after puts the C back.
[[build.step]]
fetch = { url = "https://proxy.golang.org/github.com/tree-sitter/go-tree-sitter/@v/v0.25.0.zip", sha256 = "a2be3a1732377f427a97b3640739383585d46e14dc92637bfbd3d89dd2a9e6a7", to = "c/go-tree-sitter.zip" }

[[build.step]]
extract = { file = "c/go-tree-sitter.zip", to = "c/go-tree-sitter", strip = 3 }

[[build.step]]
fetch = { url = "https://proxy.golang.org/github.com/tree-sitter/tree-sitter-go/@v/v0.25.0.zip", sha256 = "e4501d10db1aee5f0b15354f4ae31296d8d8a93282a85d12302e6c682944438a", to = "c/tree-sitter-go.zip" }

[[build.step]]
extract = { file = "c/tree-sitter-go.zip", to = "c/tree-sitter-go", strip = 3 }

# When go.mod moves either module to another version, the fetches above must
# move with it, and this step stops the build until they do.
[[build.step]]
run = """
set -eu
for m in go-tree-sitter tree-sitter-go; do
  grep -q "^# github.com/tree-sitter/$m v0.25.0$" vendor/modules.txt || { echo "go.mod moved github.com/tree-sitter/$m from v0.25.0, so oku.pkg.toml must fetch its new version"; exit 1; }
done
cp -R c/go-tree-sitter/include c/go-tree-sitter/src vendor/github.com/tree-sitter/go-tree-sitter/
cp -R c/tree-sitter-go/src vendor/github.com/tree-sitter/tree-sitter-go/
"""
shell = "sh"
when = [{ os = "darwin" }, { os = "linux" }]

[[build.step]]
run = """
$ErrorActionPreference = 'Stop'
foreach ($m in 'go-tree-sitter', 'tree-sitter-go') {
  if (-not (Select-String -Quiet -Pattern "^# github.com/tree-sitter/$m v0.25.0$" -Path vendor/modules.txt)) {
    throw "go.mod moved github.com/tree-sitter/$m from v0.25.0, so oku.pkg.toml must fetch its new version"
  }
}
Copy-Item -Recurse c/go-tree-sitter/include, c/go-tree-sitter/src vendor/github.com/tree-sitter/go-tree-sitter/
Copy-Item -Recurse c/tree-sitter-go/src vendor/github.com/tree-sitter/tree-sitter-go/
"""
shell = "pwsh"
when = { os = "windows" }

[[build.step]]
run = """
set -eu
go build -mod=vendor -trimpath -ldflags="-s -w -X main.build={{tag}}" -o fude ./cmd/fude
mkdir -p man
./fude man > man/fude.1
./fude man config > man/fude-config.5
./fude man guide > man/fude-guide.7
"""
shell = "sh"
env = { CGO_ENABLED = "1", GOTOOLCHAIN = "local", GOFLAGS = "-buildvcs=false" }
when = [{ os = "darwin" }, { os = "linux" }]

[[build.step]]
install = { bin = ["fude"], man = ["man/fude.1", "man/fude-config.5", "man/fude-guide.7"] }
when = [{ os = "darwin" }, { os = "linux" }]

# Windows has no man, so it takes fude alone. PowerShell 5.1 does not stop
# on a failed native command, so go's exit code is checked.
[[build.step]]
run = """
$ErrorActionPreference = 'Stop'
go build -mod=vendor -trimpath "-ldflags=-s -w -X main.build={{tag}}" -o fude.exe ./cmd/fude
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
"""
shell = "pwsh"
env = { CGO_ENABLED = "1", GOTOOLCHAIN = "local", GOFLAGS = "-buildvcs=false" }
when = { os = "windows" }

[[build.step]]
install = { bin = ["fude.exe"] }
when = { os = "windows" }
