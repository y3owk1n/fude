# The tmux that together.tape runs on its own server: two panes, each named
# by its border, in fude's colours and in true colour.
set -g status off
set -g escape-time 0
set -g default-terminal tmux-256color
set -as terminal-features ",xterm-256color:RGB"
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style fg=#4b5263
set -g pane-active-border-style fg=#7aa7f5
