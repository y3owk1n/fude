# The config the demo runs with.
number = true
relative_number = true
cursor_line = true
icons = true
autocomplete = true
scroll_off = 6

[keymap.normal]
"<Leader><Leader>" = ":pick files<CR>"
"<Leader>sg" = ":pick grep<CR>"

[keymap.groups]
"<Leader>s" = "search"

[filetype.go]
lsp = ["gopls"]

[lsp.gopls.settings.gopls.hints]
parameterNames = true
assignVariableTypes = true
