name: publish-artifacts

# Builds fude for each system on a runner of that system, as cgo needs a C
# compiler for the target, and uploads a zip, its checksum and its build
# provenance to the release. Each build is go install of the release's tag,
# so it is the build a user's go install makes (D37).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, os: darwin, arch: arm64 }
          - { runner: macos-15-intel, os: darwin, arch: amd64 }
          - { runner: ubuntu-latest, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: windows-latest, os: windows, arch: amd64 }
          - { runner: windows-11-arm, os: windows, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag }}
      NAME: fude-${{ matrix.os }}-${{ matrix.arch }}
      # The tags are minutes old, which the module proxy may not have yet.
      GOPRIVATE: github.com/y3owk1n/fude
      GOWORK: "off"
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      # The tag pins oku as well as the action. It brings go, and on Windows
      # llvm-mingw as the C compiler.
      - uses: y3owk1n/oku@v0.18.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - if: matrix.os != 'windows'
        shell: bash
        run: |
          set -eu
          mkdir -p dist/bin dist/share/man/man1 dist/share/man/man5 dist/share/man/man7
          GOBIN="$PWD/dist/bin" go install -trimpath -ldflags="-s -w" "github.com/y3owk1n/fude/cmd/fude@$TAG"
          test "$(dist/bin/fude version)" = "fude $TAG"
          dist/bin/fude man > dist/share/man/man1/fude.1
          dist/bin/fude man config > dist/share/man/man5/fude-config.5
          dist/bin/fude man guide > dist/share/man/man7/fude-guide.7
          cp LICENSE README.md dist/
          (cd dist && zip -qr "../$NAME.zip" .)
          shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256"

      # PowerShell 5.1 does not stop on a failed native command, so each one
      # checks its exit code.
      - if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/bin | Out-Null
          $env:GOBIN = (Resolve-Path dist/bin).Path
          go install -trimpath "-ldflags=-s -w" "github.com/y3owk1n/fude/cmd/fude@$env:TAG"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $v = & dist/bin/fude.exe version
          if ($v -ne "fude $env:TAG") { throw "fude version said $v" }
          Copy-Item LICENSE, README.md dist/
          Compress-Archive -Path dist/* -DestinationPath "$env:NAME.zip"
          $hash = (Get-FileHash "$env:NAME.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:NAME.zip" | Out-File -Encoding ascii -NoNewline "$env:NAME.zip.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.NAME }}.zip

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$NAME.zip" "$NAME.zip.sha256" --clobber
