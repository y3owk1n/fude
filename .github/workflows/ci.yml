name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The release pull request only moves versions and the changelog, and
    # main runs every check once it merges.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag pins oku as well as the action.
      - uses: y3owk1n/oku@v0.18.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The window's tests on Linux need GTK 4 and a display, which Xvfb
      # gives, drawn with cairo as it has no GL (B566).
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-1 xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run -a just ci
        env:
          GSK_RENDERER: cairo
          GDK_BACKEND: x11
          NO_AT_BRIDGE: "1"
      - if: runner.os != 'Linux'
        run: just ci
