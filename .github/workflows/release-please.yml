name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A pull request opened with the workflow's own token runs no checks, so
      # the release pull request takes a token of the user's when there is one.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN || github.token }}

  # Each module takes the release's version as a tag of its own, on the
  # release's commit, as go get and go install find them (D37).
  tag-modules:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          set -eu
          for m in api core vim frontend syntax protocol plugin sdk cmd/fude; do
            git tag "$m/$TAG" "$SHA"
            git push origin "refs/tags/$m/$TAG"
          done

  publish:
    needs: [release-please, tag-modules]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-artifacts.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
